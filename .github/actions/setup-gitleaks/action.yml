name: Install pinned Gitleaks
description: Download the official Linux scanner and verify its pinned SHA256.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        scanner_dir="$RUNNER_TEMP/envctl-gitleaks"
        mkdir -p "$scanner_dir"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$scanner_dir/gitleaks.tar.gz"
        echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | (cd "$scanner_dir" && sha256sum --check)
        tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
        echo "$scanner_dir" >> "$GITHUB_PATH"
