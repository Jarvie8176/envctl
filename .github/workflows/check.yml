name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5 PyYAML==6.0.2
      - run: python scripts/ci-dependencies.py "$RUNNER_TEMP/envctl-dependencies"
      - run: python -m pytest tests -q
      - run: python scripts/smoke-package.py
  publication-privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan all reachable history for credentials
        run: gitleaks git . --log-opts=HEAD --config .github/gitleaks.toml --redact --ignore-gitleaks-allow
      - name: Build the exact publication candidate
        run: python scripts/build.py
      - name: Check public metadata and artifact members
        run: python scripts/check-privacy.py --artifacts dist
      - name: Scan release artifacts for credentials
        run: gitleaks dir dist --max-archive-depth 2 --config .github/gitleaks.toml --redact --ignore-gitleaks-allow
